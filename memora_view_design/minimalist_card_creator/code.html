<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Minimalist Card Creator</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#135bec",
              "background-light": "#ffffff",
              "background-dark": "#0F1115",
              "surface-light": "#f6f6f8",
              "surface-dark": "#161b22",
              "divider-light": "#e5e7eb",
              "divider-dark": "#2C2F36",
              "text-secondary-light": "#6b7280",
              "text-secondary-dark": "#8b949e",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Remove default textarea focus ring for custom styling */
        textarea:focus {
            box-shadow: none !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white antialiased transition-colors duration-200">
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-md mx-auto border-x border-divider-light dark:border-divider-dark shadow-2xl">
<!-- Top Bar -->
<header class="flex items-center justify-between px-4 pt-12 pb-4 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md sticky top-0 z-10 border-b border-transparent transition-all duration-300">
<button class="text-text-secondary-light dark:text-text-secondary-dark text-base font-medium hover:text-gray-900 dark:hover:text-white transition-colors">
                Cancel
            </button>
<h1 class="text-sm font-semibold tracking-wide uppercase text-gray-400 dark:text-gray-500 opacity-0 sm:opacity-100 transition-opacity">New Card</h1>
<button class="text-primary text-base font-semibold hover:opacity-80 transition-opacity flex items-center gap-1">
                Save
            </button>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto no-scrollbar flex flex-col px-6">
<!-- Front (Question) Section -->
<div class="group py-6 transition-colors duration-300">
<div class="flex justify-between items-center mb-2">
<label class="text-xs font-bold tracking-wider text-text-secondary-light dark:text-text-secondary-dark uppercase" for="front-input">Front</label>
<button class="opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded hover:bg-surface-light dark:hover:bg-surface-dark text-primary" title="AI Generate Question">
<span class="material-symbols-outlined text-[18px]">auto_awesome</span>
</button>
</div>
<textarea class="w-full bg-transparent border-none p-0 text-2xl font-bold placeholder-gray-300 dark:placeholder-gray-700 focus:ring-0 resize-none leading-tight min-h-[120px]" id="front-input" placeholder="What do you want to memorize?"></textarea>
<!-- Attachment preview placeholder (hidden by default unless active) -->
<!-- <div class="mt-4 h-32 w-full rounded-lg bg-surface-light dark:bg-surface-dark border border-divider-light dark:border-divider-dark flex items-center justify-center text-text-secondary-dark">
                    <span class="text-xs">Image attached</span>
                </div> -->
</div>
<!-- Divider -->
<div class="h-px w-full bg-divider-light dark:bg-divider-dark my-2"></div>
<!-- Back (Answer) Section -->
<div class="group py-6 flex-1 transition-colors duration-300">
<div class="flex justify-between items-center mb-2">
<label class="text-xs font-bold tracking-wider text-text-secondary-light dark:text-text-secondary-dark uppercase" for="back-input">Back</label>
<button class="opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded hover:bg-surface-light dark:hover:bg-surface-dark text-primary" title="AI Generate Answer">
<span class="material-symbols-outlined text-[18px]">spark</span>
</button>
</div>
<textarea class="w-full bg-transparent border-none p-0 text-lg font-normal text-gray-700 dark:text-gray-300 placeholder-gray-300 dark:placeholder-gray-700 focus:ring-0 resize-none leading-relaxed min-h-[200px]" id="back-input" placeholder="The answer is..."></textarea>
</div>
<!-- Bottom Spacer to allow scroll above keyboard -->
<div class="h-20 shrink-0"></div>
</main>
<!-- Bottom Toolbar (Sticky above keyboard area) -->
<footer class="bg-background-light dark:bg-background-dark border-t border-divider-light dark:border-divider-dark px-4 py-3 pb-8">
<div class="flex items-center justify-between max-w-sm mx-auto">
<!-- Formatting Tools -->
<div class="flex items-center gap-1">
<button class="p-2 rounded-lg text-text-secondary-light dark:text-text-secondary-dark hover:bg-surface-light dark:hover:bg-surface-dark hover:text-gray-900 dark:hover:text-white transition-colors" title="Format Text">
<span class="material-symbols-outlined text-[22px]">text_fields</span>
</button>
<button class="p-2 rounded-lg text-text-secondary-light dark:text-text-secondary-dark hover:bg-surface-light dark:hover:bg-surface-dark hover:text-gray-900 dark:hover:text-white transition-colors" title="Insert Image">
<span class="material-symbols-outlined text-[22px]">image</span>
</button>
<button class="p-2 rounded-lg text-text-secondary-light dark:text-text-secondary-dark hover:bg-surface-light dark:hover:bg-surface-dark hover:text-gray-900 dark:hover:text-white transition-colors" title="Insert Equation / LaTeX">
<span class="material-symbols-outlined text-[22px]">functions</span>
</button>
<button class="p-2 rounded-lg text-text-secondary-light dark:text-text-secondary-dark hover:bg-surface-light dark:hover:bg-surface-dark hover:text-gray-900 dark:hover:text-white transition-colors" title="Insert Code Block">
<span class="material-symbols-outlined text-[22px]">code</span>
</button>
</div>
<!-- AI Enhance Action (Primary but subtle) -->
<button class="flex items-center gap-2 pl-3 pr-4 py-1.5 rounded-full bg-surface-light dark:bg-surface-dark hover:bg-primary/10 border border-transparent hover:border-primary/20 transition-all group">
<span class="material-symbols-outlined text-[18px] text-primary group-hover:scale-110 transition-transform">auto_awesome</span>
<span class="text-xs font-semibold text-primary">Enhance</span>
</button>
</div>
</footer>
</div>
<!-- Background Decoration for Presentation only (Simulating iOS wallpaper/blur behind the app window if viewed on desktop) -->
<div class="fixed inset-0 -z-10 hidden lg:block bg-gray-100 dark:bg-gray-900 flex items-center justify-center">
<!-- Abstract blurred gradient -->
<div class="absolute inset-0 bg-cover bg-center opacity-30 blur-3xl" data-alt="Abstract smooth dark gradient background" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDF7qm6AdNGVA-rjm0h8ZjKG4g_4ZmpkRGnDIij3BgIu4jlo4jeoOocR5gk0lOdfCjW2Z3qLz1dUCvyiLhDXHZ8YxVUDUVg8kR3TKTONvXnqzGJ-8-KE8k8lnEpHthvs42R0cefUgRT7-qGiccx5bBWsI91EYyIOiAOMWdTlEKAmm1d8d913E7uY7dEqG9j3x98UsaFjX91FU5jnwcuT4Kh458qFtOcVAe8wIW3zDYeo7HNRpU8GfRJaEJbcGhSyUE-MJ-p_GNbIc81');"></div>
</div>
</body></html>
