<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flashcard Study - Question State</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased selection:bg-primary/30 h-screen overflow-hidden flex justify-center">
<!-- Phone Container -->
<div class="relative flex h-full w-full max-w-[480px] flex-col bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl">
<!-- Header: Progress & Session Info -->
<header class="flex w-full flex-col items-center justify-center gap-4 py-6 px-6 z-10">
<!-- Progress Dots (Adapted from component) -->
<div class="flex flex-row items-center justify-center gap-2">
<div class="h-1.5 w-8 rounded-full bg-primary shadow-[0_0_8px_rgba(19,91,236,0.6)]"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-300 dark:bg-[#324467]"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-300 dark:bg-[#324467]"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-300 dark:bg-[#324467]"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-300 dark:bg-[#324467]"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-300 dark:bg-[#324467]"></div>
</div>
<!-- Session Title -->
<div class="flex items-center gap-2 opacity-60">
<span class="material-symbols-outlined text-sm">school</span>
<span class="text-xs font-medium tracking-widest uppercase">Session: Advanced Cardiology</span>
</div>
</header>
<!-- Main Content Area: The Flashcard -->
<main class="flex-1 px-5 py-2 flex flex-col items-center justify-center relative w-full perspective-[1000px]">
<!-- Card Surface -->
<div class="group relative flex w-full h-full max-h-[65vh] flex-col items-center justify-between rounded-3xl bg-white dark:bg-[#1c2433] shadow-[0_20px_40px_-10px_rgba(0,0,0,0.1)] dark:shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] border border-slate-100 dark:border-white/5 p-8 transition-all duration-300">
<!-- Background Decoration (Subtle Icon) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none overflow-hidden rounded-3xl">
<span class="material-symbols-outlined text-[200px] text-slate-100 dark:text-white/5 rotate-12 select-none">
                        ecg_heart
                    </span>
</div>
<!-- Top of Card: Category Tag & Options -->
<div class="flex w-full items-center justify-between z-10">
<div class="flex items-center gap-1.5 rounded-full bg-primary/10 px-3 py-1.5 border border-primary/20">
<span class="h-1.5 w-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="text-xs font-bold uppercase tracking-wide text-primary">Cardiology</span>
</div>
<button class="flex h-8 w-8 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-xl">more_vert</span>
</button>
</div>
<!-- Center of Card: The Question -->
<div class="flex flex-1 flex-col items-center justify-center text-center z-10 w-full">
<h2 class="font-display text-2xl md:text-3xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white drop-shadow-sm">
                        Explain the mechanism of Action potential in cardiac myocytes.
                    </h2>
</div>
<!-- Bottom of Card: Interaction Hint -->
<div class="flex items-center gap-2 text-slate-400 dark:text-slate-500 z-10">
<span class="material-symbols-outlined text-lg animate-bounce">touch_app</span>
<span class="text-xs font-medium uppercase tracking-wide">Tap card to flip</span>
</div>
</div>
</main>
<!-- Footer: Action Button -->
<footer class="flex w-full flex-col px-5 pb-8 pt-4 z-10">
<button class="group flex w-full cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-xl bg-primary h-14 px-6 text-white shadow-lg shadow-primary/25 transition-all hover:bg-blue-600 hover:shadow-primary/40 active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:rotate-180">visibility</span>
<span class="text-base font-bold leading-normal tracking-wide">Reveal Answer</span>
</button>
<div class="mt-4 h-1 w-1/3 self-center rounded-full bg-slate-200 dark:bg-slate-800"></div>
</footer>
</div>
</body></html>
