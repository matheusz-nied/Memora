name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: flutter (format, analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      # Os .g.dart do Drift são versionados (ver .gitignore). Se o gerado
      # divergir do commitado, o schema mudou sem regenerar.
      - name: Verificar código gerado
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet -- '*.g.dart'; then
            echo "::error::Código gerado desatualizado. Rode:"
            echo "::error::dart run build_runner build --delete-conflicting-outputs"
            git diff --stat -- '*.g.dart'
            exit 1
          fi

      - run: dart format --set-exit-if-changed lib test

      - run: flutter analyze --fatal-infos

      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
