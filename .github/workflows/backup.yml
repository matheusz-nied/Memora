name: backup

# O plano free do Supabase não tem backup nenhum. Este workflow gera um dump
# diário que você controla e que restaura em qualquer Postgres.
#
# Secrets necessários:
#   BACKUP_DATABASE_URL     conexão direta (porta 5432), não o pooler
#   BACKUP_AGE_PUBLIC_KEY   chave PÚBLICA age (`age-keygen`) — a privada fica
#                           fora do GitHub, ver tool/backup/README.md
#
# Opcionais, para enviar a um bucket S3-compatível (R2, B2, S3):
#   BACKUP_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#   AWS_DEFAULT_REGION, BACKUP_S3_ENDPOINT

on:
  schedule:
    # 05:17 UTC. Minuto quebrado de propósito: o topo da hora é o horário mais
    # concorrido do agendador do GitHub e atrasa mais.
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  dump:
    name: dump diário do postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      # Um backup que falha em silêncio é pior que nenhum, porque dá a
      # sensação de estar coberto. Sem o secret, o job reprova.
      - name: Conferir configuração
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          [ -n "$DATABASE_URL" ] || {
            echo "::error::secret BACKUP_DATABASE_URL não configurado."; exit 1; }
          [ -n "$AGE_PUBLIC_KEY" ] || {
            echo "::error::secret BACKUP_AGE_PUBLIC_KEY não configurado. O dump
            contém dados pessoais e não deve ser guardado em texto claro."; exit 1; }

      # pg_dump precisa ser >= à versão do servidor. O runner traz uma versão
      # antiga demais para os Postgres que o Supabase roda hoje.
      - name: Instalar cliente Postgres 17 e age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Gerar dump
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          BACKUP_DIR: backups
        run: ./tool/backup/dump.sh

      # Retenção do artifact é o teto do GitHub. Serve como rede de segurança,
      # não como arquivo de longo prazo — para isso use o passo do S3 abaixo.
      - uses: actions/upload-artifact@v4
        with:
          name: memora-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
          if-no-files-found: error

      - name: Enviar para bucket S3-compatível
        if: env.S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          args=(s3 cp backups/ "s3://$S3_BUCKET/memora/" --recursive)
          [ -n "$ENDPOINT" ] && args+=(--endpoint-url "$ENDPOINT")
          aws "${args[@]}"
