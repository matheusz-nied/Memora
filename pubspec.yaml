name: memora
description: "Memora — plataforma de aprendizado personalizado com IA: decks de flashcards, geração de cards por IA, estudo com repetição espaçada e agente tutor configurável por deck."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.9.0+5

environment:
  sdk: ^3.8.1
  # DropdownButtonFormField.initialValue substituiu `value` depois da 3.33.
  flutter: ">=3.35.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.0.0
  flutter_tts: ^4.2.5
  file_picker: ^11.0.2
  pdfx: ^2.9.2
  shimmer: ^3.0.0
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  fsrs: 2.0.1
  shared_preferences: ^2.5.3
  # A IA é a única coisa que precisa de rede. Serve para avisar antes de
  # tentar, em vez de deixar a chamada estourar em timeout.
  connectivity_plus: ^7.1.1
  uuid: ^4.5.3
  flutter_markdown: ^0.7.7+1
  # Chamada direta à DeepSeek no modo local. `dart:io` não serve: quebraria o
  # build web, que o app ainda suporta.
  http: ^1.5.0
  # Inflate puro em Dart, para descomprimir os streams do PDF. `dart:io` tem
  # zlib nativo, mas quebraria o build web; `archive` escolhe sozinho entre o
  # nativo e a implementação Dart conforme a plataforma.
  archive: ^4.0.9
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  # Só para gerar os PDFs dos testes do extrator. É escritor, não leitor — o
  # que lê é `lib/core/backend/local/pdf/`, escrito aqui. Fica em
  # dev_dependencies de propósito: nada disso vai para o binário publicado.
  pdf: ^3.11.1
  drift_dev: ^2.31.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - web/sqlite3.wasm

  # Inter empacotada, e não baixada em tempo de execução pelo `google_fonts`:
  # o download entregava o IP do usuário ao Google no primeiro launch e
  # deixava sem tipografia quem abrisse o app offline. Licença SIL Open Font
  # em `assets/fonts/Inter-LICENSE.txt`.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Gera todas as densidades de ícone (Android, ícone adaptativo incluído, e iOS)
# a partir de um PNG 1024×1024. Rode depois de colocar as imagens em
# `assets/icon/`:
#
#   dart run flutter_launcher_icons
#
# O `adaptive_icon_foreground` precisa ter margem: o Android recorta o ícone em
# círculo, quadrado ou gota conforme o launcher, e arte que encosta na borda é
# cortada em algum desses formatos.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  # A arte do foreground já tem ~19% de margem (zona segura do Android).
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#0A0E17"
    theme_color: "#135BEC"

# Tela de abertura, gerada nos recursos nativos por:
#
#   dart run flutter_native_splash:create
#
# As cores são as mesmas do `AppTheme` (`AppColors.background` e
# `backgroundDark`), para não haver um salto de cor entre a splash e a primeira
# tela — que é exatamente o que faz um app parecer inacabado no primeiro
# segundo de uso.
flutter_native_splash:
  color: "#F6F6F8"
  color_dark: "#101622"
  image: assets/splash/splash.png
  image_dark: assets/splash/splash.png

  # O Android 12+ ignora a splash clássica e usa a API própria do sistema: ele
  # recorta a imagem num círculo e só garante os 2/3 centrais. Por isso aqui
  # entra só a arte em transparente, com o navy do ícone vindo do fundo — o
  # mesmo desenho do ícone adaptativo.
  android_12:
    image: assets/splash/splash_android12.png
    image_dark: assets/splash/splash_android12.png
    icon_background_color: "#0A0E17"
    icon_background_color_dark: "#0A0E17"
    color: "#F6F6F8"
    color_dark: "#101622"

  android: true
  ios: true
  web: false
